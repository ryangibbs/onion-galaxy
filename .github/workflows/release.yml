name: Release

# Every push to main that passes CI is a release candidate: semantic-release reads the new commit
# messages, and if any of them is a `feat:` or `fix:` (or a breaking change) it picks the next version,
# tags it, publishes to npm and creates a GitHub release with generated notes. Other commits
# (docs:, ci:, chore:, …) release nothing.
#
# Publishing uses npm trusted publishing (OIDC), so no npm token or 2FA code is needed. Configure it
# once on npmjs.com under the package's Settings → Trusted Publisher → GitHub Actions:
# repository ryangibbs/onion-galaxy, workflow release.yml, environment npm.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only after CI passed for a push to main (or when started by hand)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # push the version tag and create the GitHub release
      issues: write # comment on issues fixed by the release
      pull-requests: write # comment on pull requests included in the release
      id-token: write # OIDC token for npm trusted publishing and provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly runs typecheck, build and tests again right before anything is uploaded
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
