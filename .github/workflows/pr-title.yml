name: PR title

# Pull requests are squash-merged and the PR title becomes the commit message on main, which
# semantic-release reads to decide the next version. So the title must be a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          # Passed through the environment, never interpolated into the script
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "✓ $TITLE"
            exit 0
          fi
          echo "::error title=PR title is not a Conventional Commit::Got \"$TITLE\". Use <type>: <summary>, e.g. \"feat: add a timeline slider\" or \"fix(viewer): keep labels on screen\". Types: feat, fix, perf (release) and refactor, docs, test, build, ci, chore, style, revert (no release). Add ! after the type for a breaking change."
          exit 1
