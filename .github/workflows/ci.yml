name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest supported release line (see engines in package.json), 24 is current LTS
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (CI)
        run: pnpm lint:ci

      - name: Format check (CI)
        run: pnpm format:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Smoke test the built CLI
        run: |
          node dist/cli.js --root fixture --no-git --out "$RUNNER_TEMP/fixture.html"
          test -s "$RUNNER_TEMP/fixture.html"

      - name: Check the published package contents
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
